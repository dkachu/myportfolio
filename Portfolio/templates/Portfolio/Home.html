{% extends 'Portfolio/base.html' %} 
{% load static %}

<!doctype html>

<html>
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
  </head>

  <body>
 
{% load static %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row align-items-center">
        <!-- Text Intro -->
        <div class="col-md-7">
            <h1 class="display-2 fw-bold text-dark">
                Hi, I'm <span class="text-primary">{{ profile.full_name|default:"Your Name" }}</span>
            </h1>
            <p class="lead fs-3 text-muted mb-4">{{ profile.headline }}</p>
            
            <div class="d-flex gap-3">
                <a href="{% url 'about' %}" class="btn btn-primary btn-lg shadow-sm px-4">About Me & Contact</a>
                <a href="{{ profile.github_url }}" class="btn btn-outline-dark btn-lg px-4">View My Work</a>
            </div>
        </div>

        <!-- Hero Image -->
        <div class="col-md-5 text-center mt-5 mt-md-0">
            {% if profile.profile_pic %}
                <img src="{{ profile.profile_pic.url }}" class="img-fluid rounded-circle shadow-lg border border-5 border-white" style="width: 350px; height: 350px; object-fit: cover;">
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}




  </body>
</html>
