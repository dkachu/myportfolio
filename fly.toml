# fly.toml app configuration file generated for portfolio-lively-shadow-2470 on 2026-03-23T09:24:37+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'portfolio-lively-shadow-2470'
primary_region = 'yyz'
console_command = '/code/manage.py shell'




[deploy]
  release_command = "sh -c 'chown -R $(whoami) /code/data && python manage.py migrate && python manage.py collectstatic --noinput'"


[mounts]
  source = "pg_data"
  destination = "/code/data"

[env]
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[[statics]]
  guest_path = '/code/static'
  url_prefix = '/static/'
